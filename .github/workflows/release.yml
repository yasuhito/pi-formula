name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Initial release tag (vX.Y.Z)
        required: true
        default: v0.1.0

jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and prepare the release tarball
        run: npm run release:prepare -- "${GITHUB_REF_NAME}" .release

      - name: Upload checked release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release
          path: .release/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download checked release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-release
          path: .release

      - name: Publish to npm with provenance
        run: npm publish .release/*.tgz --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "pi-formula ${VERSION}" \
            --notes-file .release/release-notes.md

  initial-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and prepare the initial release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: npm run release:prepare -- "${RELEASE_TAG}" .release

      - name: Verify the exact tarball is already on npm
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          set -- .release/*.tgz
          test "$#" -eq 1
          LOCAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$1" | openssl base64 -A)"
          test "$(npm view "pi-formula@${VERSION}" version)" = "${VERSION}"
          test "$(npm view "pi-formula@${VERSION}" dist.integrity)" = "${LOCAL_INTEGRITY}"

      - name: Create the remote tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="${TARGET_SHA}"
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "pi-formula ${VERSION}" \
            --notes-file .release/release-notes.md
